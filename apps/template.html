<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Graphics App Template</title>
  <style>
    body{margin:0;background:#081023;color:#dbeafe;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .nav{position:fixed;left:12px;top:12px;z-index:20}
    .nav a{color:#cfe8ff;text-decoration:none;background:rgba(2,6,23,0.6);padding:8px 10px;border-radius:8px}
    #container{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
    canvas{display:block}
    .panel{position:fixed;right:12px;top:12px;background:rgba(10,14,24,0.6);padding:12px;border-radius:8px;color:#cfe8ff}
  </style>
</head>
<body>
  <div class="nav"><a href="index.html">← Apps</a></div>
  <div id="container">
    <canvas id="canvas"></canvas>
  </div>

  <div class="panel">
    <div><strong>Template</strong></div>
    <div style="font-size:13px;margin-top:6px">Resize-safe canvas. Replace rendering code below with your WebGL/2D logic.</div>
  </div>

  <script>
    // Simple, reusable canvas setup for 2D or WebGL
    const canvas = document.getElementById('canvas');
    const ctx2d = canvas.getContext('2d');

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      if (ctx2d) ctx2d.setTransform(dpr,0,0,dpr,0,0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Example: simple animated gradient background (2D)
    let t0 = performance.now();
    function draw(now) {
      const t = (now - t0) * 0.001;
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);

      const grd = ctx2d.createLinearGradient(0,0,w,h);
      grd.addColorStop(0, `hsl(${(t*20)%360} 70% 40%)`);
      grd.addColorStop(1, `hsl(${(t*40)%360} 70% 20%)`);
      ctx2d.fillStyle = grd;
      ctx2d.fillRect(0,0,w,h);

      // placeholder for drawing content
      ctx2d.fillStyle = 'rgba(255,255,255,0.85)';
      ctx2d.font = '16px system-ui, Arial';
      ctx2d.fillText('Graphics app template — replace with your rendering code', 18, 34);

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
