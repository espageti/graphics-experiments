<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CS 418 Rasterizer</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#071027;color:#dbeafe;margin:0;padding:28px}
    main{max-width:1100px;margin:0 auto}.nav a{color:#60a5fa}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.gallery figure{margin:0;background:#111b31;padding:10px;border-radius:8px}.gallery img{display:block;width:100%;height:180px;object-fit:contain;background:#fff}.gallery figcaption{margin-top:8px;font-size:13px;color:#b8c7df}pre{background:#111b31;padding:12px;border-radius:8px;overflow:auto}a{color:#60a5fa}
  </style>
</head>
<body>
  <main>
    <p class="nav"><a href="../index.html">← Apps</a></p>
    <h1>CS 418 Rasterizer</h1>
    <p>A collection of rasterization experiments for CS 418 at UIUC.</p>
    <p><a href="program.py" download>Download program.py</a></p>
    <h2>Run it</h2>
    <pre><code>python program.py &lt;input-file&gt;
make run file=&lt;input-file&gt;</code></pre>
    <h2>Images</h2>
    <section class="gallery">
      <figure><img src="checkers.png" alt="Rasterizer checker pattern output"><figcaption>Checkers</figcaption></figure>
      <figure><img src="depth.png" alt="Rasterizer depth output"><figcaption>Depth</figcaption></figure>
      <figure><img src="frustum.png" alt="Rasterizer frustum output"><figcaption>Frustum</figcaption></figure>
      <figure><img src="gray.png" alt="Rasterizer gray output"><figcaption>Gray</figcaption></figure>
      <figure><img src="grey.png" alt="Rasterizer grey output"><figcaption>Grey</figcaption></figure>
      <figure><img src="manyclip.png" alt="Rasterizer clipping output"><figcaption>Many clip</figcaption></figure>
      <figure><img src="oldlogo.png" alt="Rasterizer logo output"><figcaption>Old logo</figcaption></figure>
      <figure><img src="perspective.png" alt="Rasterizer perspective output"><figcaption>Perspective</figcaption></figure>
      <figure><img src="sRGB.png" alt="Rasterizer sRGB output"><figcaption>sRGB</figcaption></figure>
      <figure><img src="smallgap.png" alt="Rasterizer small gap output"><figcaption>Small gap</figcaption></figure>
    </section>
  </main>
</body>
</html>
