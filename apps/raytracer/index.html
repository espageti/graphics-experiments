<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>CS 418 Raytracer</title>
	<style>
		body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#071027;color:#dbeafe;margin:0;padding:28px}
		main{max-width:1100px;margin:0 auto}.nav a{color:#60a5fa}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.gallery figure{margin:0;background:#111b31;padding:10px;border-radius:8px}.gallery img{display:block;width:100%;height:180px;object-fit:contain;background:#fff}.gallery figcaption{margin-top:8px;font-size:13px;color:#b8c7df}pre{background:#111b31;padding:12px;border-radius:8px;overflow:auto}a{color:#60a5fa}
	</style>
</head>
<body>
	<main>
		<p class="nav"><a href="../index.html">← Apps</a></p>
		<h1>CS 418 Raytracer</h1>
		<p>A collection of ray-tracing experiments for CS 418 at UIUC.</p>
		<p><a href="program.py" download>Download program.py</a></p>
		<h2>Run it</h2>
		<pre><code>python program.py &lt;input-file&gt;
make run file=&lt;input-file&gt;</code></pre>
		<h2>Images</h2>
		<section class="gallery">
			<figure><img src="bulb.png" alt="Raytracer bulb output"><figcaption>Bulb</figcaption></figure>
			<figure><img src="color.png" alt="Raytracer color output"><figcaption>Color</figcaption></figure>
			<figure><img src="expose1.png" alt="Raytracer exposure output"><figcaption>Exposure 1</figcaption></figure>
			<figure><img src="expose2.png" alt="Raytracer exposure output"><figcaption>Exposure 2</figcaption></figure>
			<figure><img src="fisheye.png" alt="Raytracer fisheye output"><figcaption>Fisheye</figcaption></figure>
			<figure><img src="panorama.png" alt="Raytracer panorama output"><figcaption>Panorama</figcaption></figure>
			<figure><img src="plane.png" alt="Raytracer plane output"><figcaption>Plane</figcaption></figure>
			<figure><img src="shadow-basic.png" alt="Basic raytracer shadows"><figcaption>Basic shadows</figcaption></figure>
			<figure><img src="shadow-plane.png" alt="Raytracer plane shadows"><figcaption>Plane shadows</figcaption></figure>
			<figure><img src="shadow-suns-onlyblue.png" alt="Blue sun shadow output"><figcaption>Blue sun</figcaption></figure>
			<figure><img src="shadow-suns-onlypurple.png" alt="Purple sun shadow output"><figcaption>Purple sun</figcaption></figure>
			<figure><img src="shadow-suns.png" alt="Multiple sun shadow output"><figcaption>Multiple suns</figcaption></figure>
			<figure><img src="shadow-triangle.png" alt="Triangle shadow output"><figcaption>Triangle shadows</figcaption></figure>
			<figure><img src="shine1.png" alt="Raytracer shine output"><figcaption>Shine</figcaption></figure>
			<figure><img src="sphere.png" alt="Raytracer sphere output"><figcaption>Sphere</figcaption></figure>
			<figure><img src="sun.png" alt="Raytracer sun output"><figcaption>Sun</figcaption></figure>
			<figure><img src="trans1.png" alt="Raytracer transparency output"><figcaption>Transparency 1</figcaption></figure>
			<figure><img src="trans3.png" alt="Raytracer transparency output"><figcaption>Transparency 3</figcaption></figure>
			<figure><img src="tri.png" alt="Raytracer triangle output"><figcaption>Triangle</figcaption></figure>
			<figure><img src="view.png" alt="Raytracer view output"><figcaption>View</figcaption></figure>
		</section>
	</main>
</body>
</html>
